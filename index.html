<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jun Market Watcher — K-Beauty</title>
<meta name="description" content="Amazon Top-100 K-beauty SKU rank tracker across US/UK/FR/ES/DE, read live from a Google Sheet." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script>
  (function () {
    try {
      var t = localStorage.getItem('jmw.theme');
      if (!t) {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = t;
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  })();
</script>
</head>
<body class="min-h-full">
<div class="app-shell">

  <header class="app-header">
    <div class="brand">
      <span class="wordmark">Jun Market Watcher</span>
      <span class="brand-sub">K-Beauty · Amazon Top 100</span>
    </div>
    <div class="header-actions">
      <a class="ghost-link" id="sheet-link" href="#" target="_blank" rel="noopener">Source sheet</a>
      <button id="theme-toggle" class="icon-btn" title="Switch theme" aria-label="Toggle theme">☀</button>
    </div>
  </header>

  <div class="kbeauty-view" id="kbeauty-root"></div>

  <footer class="app-footer">
    <span>© 2026 Jun Market Watcher. Personal research cockpit.</span>
    <span>Amazon Top-100 data via Jun's own Google Sheet · not investment advice.</span>
  </footer>

</div>

<script src="config.js"></script>
<script src="silicon2-data.js"></script>
<script src="sheet-data.js"></script>
<script src="kbeauty.js"></script>
<script>
  document.getElementById('sheet-link').href = KBEAUTY_SHEET_EDIT_URL;

  const themeBtn = document.getElementById('theme-toggle');
  function syncThemeBtn() {
    themeBtn.textContent = document.documentElement.dataset.theme === 'light' ? '☾' : '☀';
  }
  syncThemeBtn();
  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('jmw.theme', next); } catch (e) {}
    syncThemeBtn();
  });

  const tracker = createKbeautyTracker(document.getElementById('kbeauty-root'));
  tracker.activate();
</script>
</body>
</html>
