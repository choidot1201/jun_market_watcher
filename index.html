<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jun Market Watcher</title>
<meta name="description" content="Personal market cockpit — crypto and K-beauty SKU rankings live, equity/biopharma/portfolio coming next." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script>
  (function () {
    try {
      var t = localStorage.getItem('jmw.theme');
      if (!t) {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = t;
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  })();
</script>
</head>
<body class="min-h-full">
<div class="app-shell">

  <header class="app-header">
    <button class="logo" title="Home" aria-label="Jun Market Watcher home" id="logo-home-btn">
      <svg width="24" height="24" viewBox="0 0 40 40" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
          <path d="M6 28 L15 18 L21 23 L34 9" />
          <path d="M25 9 H34 V18" />
        </g>
      </svg>
      <span class="wordmark">Jun Market Watcher</span>
    </button>

    <nav class="main-nav" id="main-nav">
      <button class="nav-item nav-active" data-view="home" aria-current="page">Home</button>
      <button class="nav-item" data-view="equity">Equity</button>
      <button class="nav-item" data-view="crypto">Crypto</button>
      <button class="nav-item" data-view="biopharma">Biopharma</button>
      <button class="nav-item" data-view="kbeauty">K-Beauty</button>
      <button class="nav-item" data-view="portfolio">Portfolio</button>
    </nav>

    <span class="clock num" id="clock">—</span>
    <button id="theme-toggle" class="icon-btn" title="Switch theme" aria-label="Toggle theme">☀</button>
  </header>

  <div class="views" id="views">
    <div class="view" id="view-home"></div>
    <div class="view" id="view-equity" hidden></div>
    <div class="view" id="view-crypto" hidden></div>
    <div class="view" id="view-biopharma" hidden></div>
    <div class="view" id="view-kbeauty" hidden>
      <iframe
        class="kbeauty-frame"
        src="https://choidot1201.github.io/Amazon-Ranking-dashboard/"
        title="Jun's Amazon K-beauty ranking tracker"
        loading="lazy"
      ></iframe>
    </div>
    <div class="view" id="view-portfolio" hidden></div>
  </div>

  <footer class="app-footer">
    <span>© 2026 Jun Market Watcher. Personal research cockpit.</span>
    <span class="footer-note">Crypto via CoinGecko · K-beauty via Jun's Amazon ranking tracker · not investment advice.</span>
  </footer>

</div>

<script src="crypto.js"></script>
<script src="app.js"></script>
</body>
</html>
